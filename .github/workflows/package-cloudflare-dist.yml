name: Package Cloudflare dist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: lakeland-elite-formspree-deploy
          path: dist/
          if-no-files-found: error
          retention-days: 7
